<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>TRIGGER ON — トリオン戦闘 — KUSO ARCADE</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05080f;color:#dff0ff;
    font-family:"Trebuchet MS","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}

  #hud{position:absolute;inset:0;pointer-events:none;z-index:5;}
  #crosshair{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);}
  #crosshair::before,#crosshair::after{content:"";position:absolute;background:rgba(150,230,255,.85);box-shadow:0 0 6px #6fd6ff;}
  #crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%);}
  #crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%);}
  #lockmark{position:absolute;width:40px;height:40px;border:2px solid #ff5a3c;border-radius:50%;
    transform:translate(-50%,-50%);display:none;box-shadow:0 0 10px #ff5a3c;}

  .topL{position:absolute;top:calc(env(safe-area-inset-top,0px)+12px);left:14px;width:min(46vw,260px);}
  .lbl{font-size:11px;letter-spacing:2px;color:#9fc4dd;margin-bottom:2px;}
  .barwrap{height:13px;border:1px solid rgba(120,200,255,.5);border-radius:7px;overflow:hidden;background:rgba(0,0,0,.4);margin-bottom:8px;box-shadow:0 0 10px rgba(0,160,255,.3);}
  #hpBar{height:100%;width:100%;background:linear-gradient(90deg,#2ee6a0,#7df9ff);transition:width .12s,background .2s;}
  #trBar{height:100%;width:100%;background:linear-gradient(90deg,#3aa0ff,#9be7ff);transition:width .08s;}
  .topR{position:absolute;top:calc(env(safe-area-inset-top,0px)+12px);right:14px;text-align:right;}
  .wave{font-size:clamp(12px,3.4vw,15px);color:#ff9a6b;letter-spacing:1px;text-shadow:0 0 8px #ff5a3c;font-weight:700;}
  .kills{font-size:clamp(22px,6vw,34px);font-weight:900;color:#ffe66d;text-shadow:0 0 10px #ffb700;}
  .best{font-size:11px;opacity:.65;}

  #triggers{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px)+14px);transform:translateX(-50%);
    display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:96vw;}
  .trg{min-width:50px;text-align:center;padding:5px 7px;border-radius:9px;border:1px solid rgba(120,200,255,.4);
    background:rgba(8,16,28,.6);font-size:11px;color:#bfe0f5;letter-spacing:1px;}
  .trg .k{font-size:10px;opacity:.6;display:block;}
  .trg.act{border-color:#7df9ff;background:rgba(40,120,180,.5);color:#fff;box-shadow:0 0 14px rgba(0,200,255,.5);}

  #vig{position:absolute;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 150px 50px rgba(255,40,40,.8);transition:opacity .12s;}
  #shieldFx{position:absolute;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 120px 30px rgba(80,200,255,.5);transition:opacity .1s;}
  #cloakFx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;
    box-shadow:inset 0 0 120px 40px rgba(120,160,200,.35);backdrop-filter:grayscale(.5) brightness(.8);-webkit-backdrop-filter:grayscale(.5) brightness(.8);}
  #cloakFx::after{content:"隠密 / バッグワーム";position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);
    color:rgba(180,220,255,.5);font-size:13px;letter-spacing:4px;}

  /* mobile controls */
  .mbtn{position:absolute;border-radius:50%;border:1px solid rgba(120,200,255,.5);background:rgba(20,40,70,.4);
    color:#dff0ff;display:none;align-items:center;justify-content:center;pointer-events:auto;z-index:6;
    font-size:13px;font-weight:700;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
  #bFire{right:18px;bottom:calc(env(safe-area-inset-bottom,0px)+96px);width:88px;height:88px;font-size:15px;}
  #bShield{right:118px;bottom:calc(env(safe-area-inset-bottom,0px)+40px);width:64px;height:64px;}
  #bJump{right:190px;bottom:calc(env(safe-area-inset-bottom,0px)+44px);width:60px;height:60px;font-size:13px;}
  #bDash{right:30px;bottom:calc(env(safe-area-inset-bottom,0px)+12px);width:58px;height:58px;font-size:12px;}
  .mbtn:active,.mbtn.on{background:rgba(60,140,210,.55);}
  #stick{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(120,200,255,.3);display:none;z-index:6;pointer-events:none;}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(120,200,255,.3);}

  .overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:26px;background:radial-gradient(circle at 50% 40%,rgba(8,30,55,.82),rgba(3,6,14,.96));}
  .overlay.hidden{display:none;}
  .title{font-size:clamp(34px,11vw,72px);font-weight:900;letter-spacing:6px;color:#eaf8ff;
    text-shadow:0 0 12px #2bd0ff,0 0 30px #0a8fff;animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
  .jp{font-size:clamp(13px,4vw,17px);letter-spacing:6px;color:#7fc8ff;margin-top:4px;}
  .desc{margin-top:22px;font-size:clamp(13px,3.8vw,16px);line-height:1.9;color:#cfe6f5;max-width:560px;}
  .desc b{color:#ffe66d;} .desc .g{color:#7df9ff;}
  .ctrl{margin-top:14px;font-size:clamp(12px,3.3vw,15px);color:#9fc4dd;line-height:1.8;}
  .btn{margin-top:24px;pointer-events:auto;cursor:pointer;border:none;font-size:clamp(19px,6vw,26px);font-weight:900;letter-spacing:3px;
    color:#03101e;background:linear-gradient(180deg,#9be7ff,#2aa0e0);border-radius:12px;padding:15px 44px;
    box-shadow:0 7px 0 #176a9c,0 0 24px rgba(0,200,255,.6);}
  .btn:active{transform:translateY(4px);box-shadow:0 3px 0 #176a9c;}
  .go-title{font-size:clamp(32px,10vw,64px);font-weight:900;letter-spacing:4px;color:#ff5a3c;text-shadow:0 0 22px #ff3c1e;}
  .stat{font-size:clamp(16px,5vw,22px);margin:5px 0;} .stat b{color:#ffe66d;font-size:1.4em;}
  .newrec{color:#2ee6a0;font-weight:900;margin:8px 0;animation:pop .5s ease;}
  @keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1)}}
  .lnk{margin-top:14px;display:inline-block;color:#ffe66d;font-size:14px;font-weight:700;text-decoration:none;}
  .hint{margin-top:14px;font-size:12px;color:#7fa8c4;animation:blink 1.3s steps(2) infinite;}
  @keyframes blink{50%{opacity:.3}}
  #muteBtn{position:absolute;top:calc(env(safe-area-inset-top,0px)+10px);left:50%;transform:translateX(-50%);z-index:9;pointer-events:auto;
    width:40px;height:40px;border-radius:50%;border:none;background:rgba(0,0,0,.3);color:#fff;font-size:18px;cursor:pointer;display:none;}
  #loadingMsg{margin-top:16px;font-size:13px;color:#7fc8ff;}
  .back{position:absolute;left:12px;bottom:10px;font-size:11px;color:#7fc8ff;text-decoration:none;opacity:.7;pointer-events:auto;z-index:21;}
</style>
<script type="importmap">
{ "imports": {
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="app"></div>
<div id="hud">
  <div class="topL">
    <div class="lbl">体力</div><div class="barwrap"><div id="hpBar"></div></div>
    <div class="lbl">トリオン</div><div class="barwrap"><div id="trBar"></div></div>
  </div>
  <div class="topR">
    <div class="wave" id="waveEl">WAVE 1</div>
    <div class="kills" id="killEl">0</div>
    <div class="best">撃破最高 <span id="bestEl">0</span></div>
  </div>
  <div id="crosshair"></div><div id="lockmark"></div>
  <div id="vig"></div><div id="shieldFx"></div><div id="cloakFx"></div>
  <div id="triggers"></div>
  <div id="chargeWrap" style="position:absolute;left:50%;top:58%;transform:translateX(-50%);width:120px;height:5px;border:1px solid rgba(120,200,255,.5);border-radius:3px;overflow:hidden;display:none;"><div id="chargeBar" style="height:100%;width:0%;background:#ffd24a;box-shadow:0 0 8px #ffb700;"></div></div>
  <div id="stick"><div id="knob"></div></div>
  <button class="mbtn" id="bFire">攻撃</button>
  <button class="mbtn" id="bShield">盾</button>
  <button class="mbtn" id="bJump">跳</button>
  <button class="mbtn" id="bDash">回避</button>
</div>
<button id="muteBtn">🔊</button>

<div id="startScreen" class="overlay">
  <div class="title">TRIGGER</div>
  <div class="jp">トリオン戦闘</div>
  <div class="desc">トリガーを起動し、敵トリオン兵を制圧せよ。<br>
    <span class="g">弧月</span>で斬り、<span class="g">アステロイド</span>で撃ち、<span class="g">ハウンド</span>で追尾。<br>
    <b>シールド</b>で敵弾を防ぎ、<b>回避</b>でかわせ。<br>
    被弾でHP0になると<b>ベイルアウト</b>。</div>
  <div class="ctrl" id="ctrlText"></div>
  <button id="startBtn" class="btn">▶ TRIGGER ON</button>
  <button id="loadoutBtn" class="btn" style="margin-top:12px;font-size:clamp(14px,4vw,17px);padding:11px 26px;background:linear-gradient(180deg,#cdbf9a,#8a7c58);box-shadow:0 5px 0 #5c5238,0 0 16px rgba(180,160,110,.4);color:#1c1409">🔧 装備（トリガー編成）</button>
  <div class="hint" id="startHint"></div>
  <div id="loadingMsg">トリオン空間を生成中…</div>
</div>

<div id="loadoutScreen" class="overlay hidden">
  <div class="title" style="font-size:clamp(24px,7vw,40px)">トリガー編成</div>
  <div class="desc">使うトリガーを <b>最大8つ</b> 選択（タップで装備/解除）。<br>戦闘中は <b>1〜8キー</b> か画面下のバーで切替。</div>
  <div id="loadoutChips" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px;margin-top:16px;"></div>
  <div id="loadoutCount" style="margin-top:12px;color:#9fc4dd;font-size:13px;"></div>
  <button id="loadoutDone" class="btn">決定</button>
</div>

<div id="pauseScreen" class="overlay hidden">
  <div class="title" style="font-size:clamp(26px,8vw,46px)">PAUSED</div>
  <button id="resumeBtn" class="btn">▶ 再開</button>
</div>

<div id="overScreen" class="overlay hidden">
  <div class="go-title">BAIL OUT</div>
  <div class="newrec hidden" id="newRec">★ 撃破記録更新 ★</div>
  <div class="stat">撃破 <b id="finalKill">0</b> 体</div>
  <div class="stat" style="font-size:.9em;opacity:.85">到達 WAVE <span id="finalWave">1</span> ／ 最高 <span id="bestEl2">0</span></div>
  <button id="retryBtn" class="btn">🔁 再出撃</button>
  <div class="hint">タップ / クリックで再出撃</div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const $=id=>document.getElementById(id);
const app=$('app');
const isTouch=window.matchMedia('(pointer: coarse)').matches||('ontouchstart' in window);
$('ctrlText').innerHTML=isTouch
 ? '左ドラッグ=移動 / 右ドラッグ=照準 / 攻撃・盾・跳・回避ボタン / 下のトリガー(6種)をタップで切替<br>アイビスは攻撃長押しでチャージ'
 : 'マウス=照準 / <b>WASD</b>=移動 / 左クリック=攻撃 / 右クリック=シールド / <b>1〜6</b>=トリガー / <b>Space</b>=ジャンプ / <b>Shift</b>=回避<br>アイビスは左クリック長押しでチャージ';
$('startHint').textContent=isTouch?'タップでスタート':'クリックでスタート（マウス操作になります）';
$('muteBtn').style.display='block';
['bFire','bShield','bJump','bDash'].forEach(id=>$(id).style.display=isTouch?'flex':'none');

let renderer,scene,camera,composer,bloom,raycaster;
let W=0,H=0;
const ARENA=58, PLY_H=2.0;
const clock=new THREE.Clock();
const tmpA=new THREE.Vector3(), tmpB=new THREE.Vector3();

function resize(){ W=innerWidth;H=innerHeight; renderer.setPixelRatio(Math.min(devicePixelRatio||1,isTouch?1.5:2));
  renderer.setSize(W,H); camera.aspect=W/H; camera.updateProjectionMatrix(); composer.setSize(W,H); bloom.setSize(W,H); }
addEventListener('resize',()=>{ if(renderer)resize(); });

// shared geometries/materials
const enemyMat={ basic:new THREE.MeshBasicMaterial({color:0xff5a3c}), heavy:new THREE.MeshBasicMaterial({color:0xff9a2b}), guard:new THREE.MeshBasicMaterial({color:0x4aa0ff}), sniper:new THREE.MeshBasicMaterial({color:0xbf6bff}) };
const enemyGeo={ basic:new THREE.ConeGeometry(1.1,2.6,6), heavy:new THREE.IcosahedronGeometry(1.7,0) };
const ebulletMat=new THREE.MeshBasicMaterial({color:0xff7040});
const ebulletGeo=new THREE.SphereGeometry(0.34,8,8);
const houndMat=new THREE.MeshBasicMaterial({color:0x6bff9a});
const houndGeo=new THREE.SphereGeometry(0.34,8,8);
const tracerMat=new THREE.MeshBasicMaterial({color:0xeafdff,transparent:true,opacity:0.9});
const tracerGeo=new THREE.BoxGeometry(0.06,0.06,1);
const partGeo=new THREE.BoxGeometry(0.42,0.42,0.42);
const partMat={0xff5a3c:new THREE.MeshBasicMaterial({color:0xff5a3c}),0x6bff9a:new THREE.MeshBasicMaterial({color:0x6bff9a}),
  0xeafdff:new THREE.MeshBasicMaterial({color:0xeafdff}),0x7df9ff:new THREE.MeshBasicMaterial({color:0x7df9ff}),0xffa200:new THREE.MeshBasicMaterial({color:0xffa200}),0xbf6bff:new THREE.MeshBasicMaterial({color:0xbf6bff})};
const senkuGeo=new THREE.BoxGeometry(5.5,0.5,0.5), senkuMat=new THREE.MeshBasicMaterial({color:0x9beaff,transparent:true,opacity:0.85});
const meteoraGeo=new THREE.SphereGeometry(0.5,10,10), meteoraMat=new THREE.MeshBasicMaterial({color:0xffa200});
const escudoGeo=new THREE.BoxGeometry(4.2,3.2,0.35), escudoMat=new THREE.MeshBasicMaterial({color:0x6fd6ff,transparent:true,opacity:0.4,side:THREE.DoubleSide});
const beamGeo=new THREE.BoxGeometry(0.07,0.07,1), beamMat=new THREE.MeshBasicMaterial({color:0xff3c3c,transparent:true,opacity:0.5});

const enemyPool=[], ebulletPool=[], houndPool=[], tracerPool=[], particlePool=[], pprojPool=[], escudoPool=[], beamPool=[];
let gun, slashMesh, shieldMesh, ringMeshes=[], cubeGroup;

function initThree(){
  renderer=new THREE.WebGLRenderer({antialias:!isTouch,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,isTouch?1.5:2));
  renderer.setSize(innerWidth,innerHeight); app.appendChild(renderer.domElement);
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x05080f); scene.fog=new THREE.FogExp2(0x05080f,0.014);
  camera=new THREE.PerspectiveCamera(80,innerWidth/innerHeight,0.1,300); camera.position.set(0,PLY_H,0);
  scene.add(new THREE.AmbientLight(0x4060a0,0.7));

  const grid=new THREE.GridHelper(ARENA*2.4,60,0x2bd0ff,0x12305a); grid.material.transparent=true; grid.material.opacity=0.5; scene.add(grid);
  const floor=new THREE.Mesh(new THREE.CircleGeometry(ARENA*1.3,64),new THREE.MeshBasicMaterial({color:0x060c18})); floor.rotation.x=-Math.PI/2; floor.position.y=-0.02; scene.add(floor);
  for(let i=0;i<3;i++){ const r=new THREE.Mesh(new THREE.TorusGeometry(ARENA,0.3,8,80),new THREE.MeshBasicMaterial({color:i===1?0x7df9ff:0x2bd0ff})); r.rotation.x=Math.PI/2; r.position.y=0.5+i*5; ringMeshes.push(r); scene.add(r); }
  for(let i=0;i<24;i++){ const a=i/24*Math.PI*2,h=10+Math.random()*16; const p=new THREE.Mesh(new THREE.BoxGeometry(2,h,2),new THREE.MeshBasicMaterial({color:0x0a2348})); p.position.set(Math.cos(a)*(ARENA+8),h/2,Math.sin(a)*(ARENA+8)); scene.add(p); }

  // first-person weapon model
  gun=new THREE.Group();
  const barrel=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.12,0.9),new THREE.MeshBasicMaterial({color:0x2f9fc4})); barrel.position.set(0.4,-0.5,-0.8); gun.add(barrel);
  camera.add(gun); scene.add(camera);
  // トリオンキューブ（シューター系トリガー装備時に手元で浮遊）
  cubeGroup=new THREE.Group(); const cubeG=new THREE.BoxGeometry(0.13,0.13,0.13), cubeM=new THREE.MeshBasicMaterial({color:0x9be7ff});
  for(let i=0;i<6;i++){ const cb=new THREE.Mesh(cubeG,cubeM); const a=i/6*Math.PI*2; cb.position.set(0.5+Math.cos(a)*0.2,-0.42+Math.sin(a)*0.2,-1.0); cubeGroup.add(cb); }
  cubeGroup.visible=false; camera.add(cubeGroup);

  // blade slash (a thin glowing arc plane), hidden by default
  slashMesh=new THREE.Mesh(new THREE.RingGeometry(2.2,7,24,1,-0.7,1.4),new THREE.MeshBasicMaterial({color:0x9beaff,transparent:true,opacity:0,side:THREE.DoubleSide}));
  slashMesh.rotation.x=-Math.PI/2; scene.add(slashMesh);

  // shield hex in front of camera
  shieldMesh=new THREE.Mesh(new THREE.CircleGeometry(1.5,6),new THREE.MeshBasicMaterial({color:0x6fd6ff,transparent:true,opacity:0,side:THREE.DoubleSide}));
  shieldMesh.position.set(0,-0.1,-1.7); camera.add(shieldMesh);

  // pools
  for(let i=0;i<14;i++){ const e={mesh:new THREE.Mesh(enemyGeo.basic,enemyMat.basic),type:'basic',hp:0,alive:false,fireT:0,spin:0,role:'shoot'}; e.mesh.visible=false; e.mesh.userData.enemy=e; scene.add(e.mesh); enemyPool.push(e); }
  for(let i=0;i<60;i++){ const m=new THREE.Mesh(ebulletGeo,ebulletMat); m.visible=false; scene.add(m); ebulletPool.push({mesh:m,vx:0,vy:0,vz:0,life:0}); }
  for(let i=0;i<24;i++){ const m=new THREE.Mesh(houndGeo,houndMat); m.visible=false; scene.add(m); houndPool.push({mesh:m,vx:0,vy:0,vz:0,life:0,target:null}); }
  for(let i=0;i<12;i++){ const m=new THREE.Mesh(meteoraGeo,meteoraMat); m.visible=false; scene.add(m); pprojPool.push({mesh:m,vx:0,vy:0,vz:0,life:0,type:'',dmg:0,hit:null}); }
  for(let i=0;i<2;i++){ const m=new THREE.Mesh(escudoGeo,escudoMat); m.visible=false; scene.add(m); escudoPool.push({mesh:m,life:0}); }
  for(let i=0;i<4;i++){ const m=new THREE.Mesh(beamGeo,beamMat); m.visible=false; scene.add(m); beamPool.push({mesh:m,owner:null}); }
  for(let i=0;i<20;i++){ const m=new THREE.Mesh(tracerGeo,tracerMat); m.visible=false; scene.add(m); tracerPool.push({mesh:m,life:0}); }
  for(let i=0;i<200;i++){ const m=new THREE.Mesh(partGeo,partMat[0xeafdff]); m.visible=false; scene.add(m); particlePool.push({mesh:m,life:0,vx:0,vy:0,vz:0}); }

  composer=new EffectComposer(renderer); composer.addPass(new RenderPass(scene,camera));
  bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),isTouch?0.85:1.05,0.7,0.0); composer.addPass(bloom);
  composer.setSize(innerWidth,innerHeight);
  raycaster=new THREE.Raycaster();
}

// ---- audio ----
let actx=null,muted=false;
function ensureAudio(){ if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;}} if(actx&&actx.state==='suspended')actx.resume(); }
function beep(f,d,t,v,sl){ if(muted||!actx)return; const o=actx.createOscillator(),g=actx.createGain(); o.type=t||'square'; o.frequency.value=f; if(sl)o.frequency.exponentialRampToValueAtTime(sl,actx.currentTime+d); g.gain.value=v||0.05; o.connect(g);g.connect(actx.destination); const n=actx.currentTime; g.gain.setValueAtTime(g.gain.value,n); g.gain.exponentialRampToValueAtTime(0.0001,n+d); o.start(n);o.stop(n+d); }
function noise(d,v){ if(muted||!actx)return; const n=Math.floor(actx.sampleRate*d),b=actx.createBuffer(1,n,actx.sampleRate),dd=b.getChannelData(0); for(let i=0;i<n;i++)dd[i]=(Math.random()*2-1)*(1-i/n); const s=actx.createBufferSource();s.buffer=b; const g=actx.createGain();g.gain.value=v||0.1; s.connect(g);g.connect(actx.destination);s.start(); }
const sfx={ shot:()=>beep(640,0.05,'square',0.03,300), slash:()=>{noise(0.12,0.07);beep(800,0.12,'sawtooth',0.05,300);},

$('muteBtn').addEventListener('click',()=>{ muted=!muted; $('muteBtn').textContent=muted?'🔇':'🔊'; });

// トリガー登録（id固定）。0弧月 1旋空 2アステロイド 3ハウンド 4メテオラ 5アイビス 6エスクード 7バッグワーム 8バイパー 9サラマンダー 10スコーピオン

const TR_COST=[8,16,3,26,30,42,28,20,10,38,6,26,16,14];

const DEF_LOADOUT=[0,10,2,3,4,5,6,7]; // 8スロット既定

player.loadout=loadLoadout();
let prevFireDown=false;

// touch
let moveId=null,lookId=null,lookLast={x:0,y:0},stickO={x:0,y:0};
function tStart(e){ for(const t of e.changedTouches){ const tg=t.target;
  if(tg.classList&&tg.classList.contains('mbtn'))continue; if(tg.classList&&tg.classList.contains('trg'))continue; if(tg.id==='muteBtn')continue;
  if(t.clientX<innerWidth*0.5&&moveId===null){ moveId=t.identifier; stickO={x:t.clientX,y:t.clientY}; const s=$('stick'); s.style.display='block'; s.style.left=(t.clientX-60)+'px'; s.style.top=(t.clientY-60)+'px'; $('knob').style.left='50%'; $('knob').style.top='50%'; }
  else if(t.clientX>=innerWidth*0.5&&lookId===null){ lookId=t.identifier; lookLast={x:t.clientX,y:t.clientY}; } } }
function tMove(e){ if(state!==ST.PLAY)return; for(const t of e.changedTouches){
  if(t.identifier===moveId){ let dx=t.clientX-stickO.x,dy=t.clientY-stickO.y,m=52,l=Math.hypot(dx,dy); if(l>m){dx=dx/l*m;dy=dy/l*m;} $('knob').style.left=(50+dx/m*46)+'%'; $('knob').style.top=(50+dy/m*46)+'%'; move.x=dx/m; move.y=dy/m; }
  else if(t.identifier===lookId){ player.yaw-=(t.clientX-lookLast.x)*0.005; player.pitch+=(t.clientY-lookLast.y)*0.005; player.pitch=Math.max(-1.4,Math.min(1.4,player.pitch)); lookLast={x:t.clientX,y:t.clientY}; } } }
function tEnd(e){ for(const t of e.changedTouches){ if(t.identifier===moveId){moveId=null;move.x=0;move.y=0;$('stick').style.display='none';} if(t.identifier===lookId)lookId=null; } }
addEventListener('touchstart',tStart,{passive:true}); addEventListener('touchmove',tMove,{passive:true}); addEventListener('touchend',tEnd); addEventListener('touchcancel',tEnd);
$('bFire').addEventListener('touchstart',e=>{e.preventDefault();ensureAudio();fireDown=true;primaryPress();},{passive:false});
$('bFire').addEventListener('touchend',e=>{e.preventDefault();fireDown=false;});

let tmpLoadout=[];
function openLoadout(){ tmpLoadout=player.loadout.slice(); $('startScreen').classList.add('hidden'); $('loadoutScreen').classList.remove('hidden'); renderChips(); }
function renderChips(){ const c=$('loadoutChips'); c.innerHTML='';
  TR_NAME.forEach((nm,id)=>{ const on=tmpLoadout.indexOf(id)>=0; const d=document.createElement('div'); d.className='trg'+(on?' act':'');

$('loadoutChips').addEventListener('touchstart',e=>{ const el=e.target.closest('.trg'); if(el){ e.preventDefault(); ensureAudio(); toggleChip(+el.dataset.id); } },{passive:false});

function setWeapon(w){ if(player.loadout.indexOf(w)<0)return; if(w!==player.weapon)sfx.swap(); player.weapon=w;
  document.querySelectorAll('#triggers .trg').forEach(el=>el.classList.toggle('act',+el.dataset.w===w)); }
function buildBar(){ const c=$('triggers'); c.innerHTML='';
  player.loadout.forEach((id,i)=>{ const d=document.createElement('div'); d.className='trg'+(id===player.weapon?' act':''); d.dataset.w=id;
    d.innerHTML='<span class="k">'+(i+1)+'</span>'+TR_NAME[id]; c.appendChild(d); }); }

$('triggers').addEventListener('touchstart',e=>{ const el=e.target.closest('.trg'); if(el){ e.preventDefault(); e.stopPropagation(); ensureAudio(); setWeapon(+el.dataset.w); } },{passive:false});

// ---- flow ----
function startGame(){ player.pos.set(0,PLY_H,0); player.vel.set(0,0,0); player.yaw=0; player.pitch=0;
  player.hp=player.maxHp; player.trion=player.maxTrion; player.weapon=player.loadout[0]; player.dash=1; player.dashReady=true; player.invuln=0; player.shield=false;
  player.vy=0; player.onGround=true; player.charge=0; player.fireT=0; player.cloak=false; player.cloakT=0; prevFireDown=false;
  kills=0; wave=1; shake=0; move.x=0; move.y=0; fireDown=false; shieldDown=false;
  for(const e of enemyPool)deact(e); for(const b of ebulletPool){b.life=0;b.mesh.visible=false;} for(const h of houndPool){h.life=0;h.mesh.visible=false;} for(const p of particlePool){p.life=0;p.mesh.visible=false;} for(const p of pprojPool){p.life=0;p.mesh.visible=false;} for(const w of escudoPool){w.life=0;w.mesh.visible=false;} for(const bp of beamPool){bp.owner=null;bp.mesh.visible=false;}
  $('cloakFx').style.opacity='0';
  camera.fov=80; camera.updateProjectionMatrix(); $('chargeWrap').style.display='none';
  buildBar(); player.weapon=-1; setWeapon(player.loadout[0]);
  startWave(1);
  state=ST.PLAY; $('startScreen').classList.add('hidden'); $('overScreen').classList.add('hidden'); $('pauseScreen').classList.add('hidden');
  updateHUD(); if(!isTouch)lockPointer(); clock.getDelta();
}
function pause(){ if(state!==ST.PLAY)return; state=ST.PAUSE; $('pauseScreen').classList.remove('hidden'); }
function resume(){ if(state!==ST.PAUSE)return; state=ST.PLAY; $('pauseScreen').classList.add('hidden'); if(!isTouch)lockPointer(); clock.getDelta(); }
function gameOver(){ state=ST.OVER; sfx.over(); sfx.bail(); shake=Math.max(shake,1.6); if(document.pointerLockElement)document.exitPointerLock();
  $('finalKill').textContent=kills; $('finalWave').textContent=wave;
  if(kills>best){ best=kills; localStorage.setItem('trigger_best',String(best)); $('newRec').classList.remove('hidden'); } else $('newRec').classList.add('hidden');
  $('bestEl').textContent=best; $('bestEl2').textContent=best;
  if(window.Rank) Rank.submitScore('trigger', kills);
  setTimeout(()=>{ if(state===ST.OVER)$('overScreen').classList.remove('hidden'); },650);
}
function startWave(n){ wave=n; $('waveEl').textContent='WAVE '+n; sfx.wave();
  waveRemain = 3+Math.floor(n*1.5); spawnTimer=0; }

// ---- helpers ----
function forwardVec(){ return tmpA.set(Math.sin(player.yaw)*Math.cos(player.pitch),Math.sin(player.pitch),Math.cos(player.yaw)*Math.cos(player.pitch)).multiplyScalar(-1).normalize(); }
function deact(e){ e.alive=false; e.mesh.visible=false; e.mesh.position.set(0,-999,0); e.aimT=0; if(e.beam){ e.beam.owner=null; e.beam.mesh.visible=false; e.beam=null; } }
function getEnemy(){ for(const e of enemyPool)if(!e.alive)return e; return null; }
function aliveEnemies(){ let c=0; for(const e of enemyPool)if(e.alive)c++; return c; }

function spawnEnemy(){ const e=getEnemy(); if(!e)return; const heavy=(wave>=3&&Math.random()<0.28);
  e.guard=(wave>=2&&!heavy&&Math.random()<0.25);
  e.sniper=(wave>=4&&!heavy&&!e.guard&&Math.random()<0.22);
  e.aimT=0; if(e.beam){ e.beam.owner=null; e.beam.mesh.visible=false; e.beam=null; }
  e.type=heavy?'heavy':'basic'; e.mesh.geometry=heavy?enemyGeo.heavy:enemyGeo.basic;
  e.mesh.material= e.sniper?enemyMat.sniper:e.guard?enemyMat.guard:(heavy?enemyMat.heavy:enemyMat.basic);
  e.colorHex= e.sniper?0xbf6bff:e.guard?0x7df9ff:(heavy?0xff9a2b:0xff5a3c);
  e.hp=(heavy?120:e.guard?80:e.sniper?60:55)+wave*6; e.alive=true;
  e.speed=(heavy?4.0:e.sniper?3.8:6.0)+Math.min(wave*0.3,5); e.fireT=(e.sniper?2.5:1)+Math.random()*1.5;
  e.range= e.sniper?42:heavy?14:20; e.role= e.sniper?'sniper':e.guard?'shoot':(Math.random()<0.25?'rush':'shoot');
  e.spin=(Math.random()-0.5)*2;
  const a=Math.random()*Math.PI*2,r=ARENA*0.9; e.mesh.position.set(Math.cos(a)*r,1.4,Math.sin(a)*r); e.mesh.visible=true; }

// ---- combat ----
function primaryPress(){ // press: 弧月/旋空/ハウンド/メテオラ/エスクード/バッグワーム。アステロイドは押しっぱ、アイビスはチャージ。
  if(state!==ST.PLAY)return;
  if(player.weapon===0) meleeAttack();
  else if(player.weapon===1) senkuFire();
  else if(player.weapon===3) houndFire();
  else if(player.weapon===4) meteoraFire();
  else if(player.weapon===6) escudoDeploy();
  else if(player.weapon===7) bagwormToggle();
  else if(player.weapon===8) viperFire();
  else if(player.weapon===9) salamanderFire();
  else if(player.weapon===10) scorpionAttack();
  else if(player.weapon===13) raygustAttack();
}
function spend(c){ if(player.trion>=c){ player.trion-=c; return true; } return false; }
function breakCloak(){ if(player.cloak){ player.cloak=false; player.cloakT=0; } }

function escudoDeploy(){ if(player.fireT>0)return; if(!spend(TR_COST[6]))return; player.fireT=0.5; sfx.shield();
  let w=null; for(const q of escudoPool)if(q.life<=0){w=q;break;} if(!w){ w=escudoPool[0]; }
  const f=forwardVec(); w.mesh.position.set(player.pos.x+f.x*4, PLY_H, player.pos.z+f.z*4);
  w.mesh.lookAt(player.pos.x, PLY_H, player.pos.z); w.life=6.5; w.mesh.visible=true;
  spawnParticles(w.mesh.position,0x7df9ff,8,0.6); }
function bagwormToggle(){ if(player.fireT>0)return; if(!player.cloak){ if(!spend(TR_COST[7]))return; player.cloak=true; player.cloakT=9; sfx.swap(); }
  else { player.cloak=false; player.cloakT=0; } player.fireT=0.4; }

function trionCubes(n,col){ const origin=camera.getWorldPosition(new THREE.Vector3()); const f=forwardVec();
  const base=origin.clone().addScaledVector(f,1.4); for(let i=0;i<n;i++) spawnParticles(base,col,1,0.25); }

function senkuFire(){ if(player.fireT>0)return; if(!spend(TR_COST[1]))return; breakCloak(); player.fireT=0.5; sfx.slash();
  // 旋空＝弧月の斬撃を“伸ばす”：長射程の即時薙ぎ
  const f=forwardVec(); slashMesh.position.copy(player.pos); slashMesh.position.y=PLY_H-0.3; slashMesh.scale.setScalar(2.0);
  slashMesh.material.opacity=0.9; slashT=0.22; const ang=Math.atan2(f.x,f.z); slashMesh.rotation.z=-ang;
  let hitAny=false; for(const e of enemyPool){ if(!e.alive)continue; const to=tmpB.subVectors(e.mesh.position,player.pos); const d=to.length(); if(d>14)continue; to.normalize(); const dot=f.x*to.x+f.z*to.z; if(dot>0.5){ damageEnemy(e,52,e.mesh.position); hitAny=true; } }
  if(hitAny){ shake=Math.max(shake,0.55); hitstop=Math.max(hitstop,0.03); } }

function meteoraFire(){ if(player.fireT>0)return; if(!spend(TR_COST[4]))return; breakCloak(); player.fireT=0.85; sfx.hound(); trionCubes(3,0xffa200);
  const origin=camera.getWorldPosition(new THREE.Vector3()); const f=forwardVec();
  let p=null; for(const q of pprojPool)if(q.life<=0){p=q;break;} if(!p)return;
  p.type='meteora'; p.dmg=60; p.hit=null; p.mesh.geometry=meteoraGeo; p.mesh.material=meteoraMat; p.mesh.scale.setScalar(1);
  p.mesh.position.copy(origin).addScaledVector(f,1.5); p.vx=f.x*34; p.vy=f.y*34; p.vz=f.z*34; p.life=2.2; p.mesh.visible=true; }
function explode(pos,dmg,radius,col){ spawnParticles(pos,col||0xffa200,26,1.2); spawnParticles(pos,0xeafdff,10,0.9); sfx.bail(); shake=Math.max(shake,0.9); hitstop=Math.max(hitstop,0.04);
  for(const e of enemyPool){ if(!e.alive)continue; const d=e.mesh.position.distanceTo(pos); if(d<radius) damageEnemy(e,dmg*(1-d/radius*0.45),e.mesh.position,{pierceGuard:true}); } }
function meteoraExplode(pos){ explode(pos,90,8.5,0xffa200); }
function viperFire(){ if(player.fireT>0)return; if(!spend(TR_COST[8]))return; breakCloak(); player.fireT=0.3; sfx.shot(); trionCubes(1,0x9beaff);
  const origin=camera.getWorldPosition(new THREE.Vector3()); const f=forwardVec(); const tgt=lockTarget();
  const rx=Math.cos(player.yaw), rz=-Math.sin(player.yaw); // 進行方向に対する右
  for(const side of [-1,1]){ let p=null; for(const q of pprojPool)if(q.life<=0){p=q;break;} if(!p)break;
    p.type='viper'; p.dmg=18; p.target=tgt; p.t0=0; p.side=side; p.rx=rx; p.rz=rz; p.mesh.geometry=meteoraGeo; p.mesh.material=senkuMat; p.mesh.scale.setScalar(0.8);
    p.mesh.position.copy(origin).addScaledVector(f,1.4+side*0.15); p.vx=f.x*38; p.vy=f.y*38; p.vz=f.z*38; p.life=1.9; p.mesh.visible=true; } }
function salamanderFire(){ if(player.fireT>0)return; if(!spend(TR_COST[9]))return; breakCloak(); player.fireT=1.0; sfx.hound(); trionCubes(4,0xffa200);
  const origin=camera.getWorldPosition(new THREE.Vector3()); const f=forwardVec();
  let p=null; for(const q of pprojPool)if(q.life<=0){p=q;break;} if(!p)return;
  p.type='salamander'; p.dmg=110; p.hit=null; p.mesh.geometry=meteoraGeo; p.mesh.material=meteoraMat; p.mesh.scale.setScalar(1.5);
  p.mesh.position.copy(origin).addScaledVector(f,1.5); p.vx=f.x*30; p.vy=f.y*30; p.vz=f.z*30; p.life=2.4; p.mesh.visible=true; }
function scorpionAttack(){ if(player.fireT>0)return; if(!spend(TR_COST[10]))return; breakCloak(); player.fireT=0.26; sfx.slash();
  const f=forwardVec(); slashMesh.position.copy(player.pos); slashMesh.position.y=PLY_H-0.3; slashMesh.scale.setScalar(1); slashMesh.material.opacity=0.85; slashT=0.14; const ang=Math.atan2(f.x,f.z); slashMesh.rotation.z=-ang;
  let hitAny=false; for(const e of enemyPool){ if(!e.alive)continue; const to=tmpB.subVectors(e.mesh.position,player.pos); const d=to.length(); if(d>6.5)continue; to.normalize(); const dot=f.x*to.x+f.z*to.z; if(dot>0.5){ damageEnemy(e,42,e.mesh.position); hitAny=true; } }
  if(hitAny){ shake=Math.max(shake,0.4); hitstop=Math.max(hitstop,0.025); } }

function sniperFire(charge){ var S=SNIPERS[player.weapon]||SNIPERS[5]; if(!spend(TR_COST[player.weapon])){ return; } breakCloak(); player.fireT=S.ct; sfx.shot(); muzzleT=0.06;
  const origin=camera.getWorldPosition(new THREE.Vector3()); const dir=forwardVec();
  const dmg=S.base+Math.round(charge*S.scale); // piercing
  spawnTracer(origin.clone().addScaledVector(dir,1.2), origin.clone().addScaledVector(dir,150));
  const hitSet=new Set();
  const meshes=[]; for(const e of enemyPool)if(e.alive)meshes.push(e.mesh);
  raycaster.set(origin,dir); raycaster.far=160; const inter=raycaster.intersectObjects(meshes,false);
  for(const it of inter){ const e=it.object.userData.enemy; if(e&&e.alive&&!hitSet.has(e)){ hitSet.add(e); damageEnemy(e,dmg,it.point,{pierceGuard:true}); } }
  // 角度フォールバック（多少ズレても貫通ライン上の敵に当たる）
  for(const e of enemyPool){ if(!e.alive||hitSet.has(e))continue; const to=tmpB.subVectors(e.mesh.position,origin); const dist=to.length(); if(dist>160)continue; to.normalize(); if(to.dot(dir)>Math.cos(0.13)){ hitSet.add(e); damageEnemy(e,dmg,e.mesh.position,{pierceGuard:true}); } }
  shake=Math.max(shake,0.7); }

function raygustAttack(){ if(player.fireT>0)return; if(!spend(TR_COST[13]))return; breakCloak(); player.fireT=0.55; sfx.slash();

// ---- update ----
let hitstop=0;
function update(dt){
  // trion regen
  player.trion=Math.min(player.maxTrion, player.trion + 16*dt);
  if(player.invuln>0)player.invuln-=dt;
  if(player.fireT>0)player.fireT-=dt;

  else { shieldMesh.material.opacity=0; $('shieldFx').style.opacity='0'; }

  // escudo walls

  // desktop movement input

  const wantFov=sniping?80-player.charge*zoomW:80; camera.fov+=(wantFov-camera.fov)*Math.min(1,dt*8); camera.updateProjectionMatrix();
  $('chargeWrap').style.display=sniping?'block':'none'; $('chargeBar').style.width=(player.charge*100)+'%';
  prevFireDown=fireDown;

  // 隠密(バッグワーム)：敵がプレイヤーを見失う
  const track=!player.cloak;
  // enemies
  for(const e of enemyPool){ if(!e.alive)continue; const m=e.mesh; if(m.scale.x>1)m.scale.setScalar(Math.max(1,m.scale.x-dt*4));
    const to=tmpB.set(player.pos.x-m.position.x,0,player.pos.z-m.position.z); const d=to.length()||1; to.x/=d; to.z/=d;

        if(e.beam){ const ex=m.position; const tg=tmpA.set(player.pos.x-ex.x,(PLY_H-0.3)-ex.y,player.pos.z-ex.z); const len=tg.length()||1;
          e.beam.mesh.position.set(ex.x+tg.x*0.5, ex.y+tg.y*0.5, ex.z+tg.z*0.5); e.beam.mesh.scale.set(1,1,len);
          e.beam.mesh.lookAt(player.pos.x,PLY_H-0.3,player.pos.z); e.beam.mesh.material.opacity=0.3+Math.abs(Math.sin(elapsedT*22))*0.5; }

          if(e.beam){ e.beam.owner=null; e.beam.mesh.visible=false; e.beam=null; } e.fireT=2.6+Math.random()*1.2; }

  }

  // enemy bullets
  for(const b of ebulletPool){ if(b.life<=0)continue; b.life-=dt; b.mesh.position.x+=b.vx*dt; b.mesh.position.y+=b.vy*dt; b.mesh.position.z+=b.vz*dt;

    const dx=b.mesh.position.x-player.pos.x,dy=b.mesh.position.y-player.pos.y,dz=b.mesh.position.z-player.pos.z; const dd=Math.hypot(dx,dy,dz);

    if(h.target){ const tp=h.target.mesh.position; if(Math.hypot(tp.x-h.mesh.position.x,tp.y-h.mesh.position.y,tp.z-h.mesh.position.z)<1.6){ damageEnemy(h.target,22,h.mesh.position); h.life=0; h.mesh.visible=false; continue; } }
    if(h.life<=0)h.mesh.visible=false; }

  // 旋空波 / メテオラ
  for(const p of pprojPool){ if(p.life<=0)continue; p.life-=dt;
    p.mesh.position.x+=p.vx*dt; p.mesh.position.y+=p.vy*dt; p.mesh.position.z+=p.vz*dt;
    if(p.type==='senku'){ for(const e of enemyPool){ if(!e.alive||p.hit.has(e))continue; if(e.mesh.position.distanceTo(p.mesh.position)<3.2){ p.hit.add(e); damageEnemy(e,p.dmg,e.mesh.position); } }

    else if(p.type==='meteora'){ let boom=false; for(const e of enemyPool){ if(!e.alive)continue; if(e.mesh.position.distanceTo(p.mesh.position)<1.6){ boom=true; break; } }

  // particles
  for(const p of particlePool){ if(p.life<=0)continue; p.life-=dt; p.vy-=22*dt; p.mesh.position.x+=p.vx*dt; p.mesh.position.y+=p.vy*dt; p.mesh.position.z+=p.vz*dt; p.mesh.rotation.x+=dt*8; const s=Math.max(0,p.life*1.6); p.mesh.scale.setScalar(s); if(p.life<=0||p.mesh.position.y<0){p.life=0;p.mesh.visible=false;} }
  // tracers
  for(const tr of tracerPool){ if(tr.life<=0)continue; tr.life-=dt; tr.mesh.scale.x=tr.mesh.scale.y=Math.max(0.2,tr.life/0.05); if(tr.life<=0)tr.mesh.visible=false; }

  // spawning / waves
  if(waveRemain>0){ spawnTimer-=dt; if(spawnTimer<=0 && aliveEnemies()<Math.min(8,3+wave)){ spawnEnemy(); waveRemain--; spawnTimer=0.7; } }
  else if(aliveEnemies()===0){ startWave(wave+1); }

  for(let i=0;i<ringMeshes.length;i++)ringMeshes[i].rotation.z+=dt*(0.08+i*0.04);
  if(shake>0)shake=Math.max(0,shake-dt*2.4);
  updateHUDbars();
  applyCamera(dt);
}
function applyCamera(dt){ camera.position.copy(player.pos); if(shake>0){ const s=shake*0.5; camera.position.x+=(Math.random()-0.5)*s; camera.position.y+=(Math.random()-0.5)*s; }
  const d=forwardVec(); camera.lookAt(camera.position.x+d.x,camera.position.y+d.y,camera.position.z+d.z); }

  composer.render(); }

catch(err){ $('loadingMsg').textContent='読み込み失敗: '+err.message; console.error(err); }

</script>
